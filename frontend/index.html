<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EstateAI — Real Estate Intelligence Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 40%, #24243e 70%, #0d1b2a 100%);
      min-height: 100vh;
      color: #e2e8f0;
      overflow-x: hidden;
    }

    /* Animated background orbs */
    body::before {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
      top: -200px; left: -200px;
      animation: orb1 15s ease-in-out infinite alternate;
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%);
      bottom: -150px; right: -150px;
      animation: orb2 18s ease-in-out infinite alternate;
      pointer-events: none; z-index: 0;
    }
    @keyframes orb1 { from { transform: translate(0,0) scale(1); } to { transform: translate(80px,60px) scale(1.1); } }
    @keyframes orb2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-60px,-80px) scale(1.15); } }

    /* Glass card */
    .glass {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
    }
    .glass-dark {
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
    }
    .glass-strong {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
    }

    /* Glow effects */
    .glow-purple { box-shadow: 0 0 30px rgba(139,92,246,0.3), inset 0 1px 0 rgba(255,255,255,0.1); }
    .glow-blue   { box-shadow: 0 0 30px rgba(59,130,246,0.3), inset 0 1px 0 rgba(255,255,255,0.1); }
    .glow-emerald{ box-shadow: 0 0 30px rgba(16,185,129,0.3), inset 0 1px 0 rgba(255,255,255,0.1); }
    .glow-amber  { box-shadow: 0 0 30px rgba(245,158,11,0.3), inset 0 1px 0 rgba(255,255,255,0.1); }
    .glow-rose   { box-shadow: 0 0 30px rgba(244,63,94,0.3), inset 0 1px 0 rgba(255,255,255,0.1); }

    /* Sidebar nav */
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 12px;
      cursor: pointer; transition: all 0.2s; font-size: 14px;
      color: rgba(255,255,255,0.6);
    }
    .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .nav-item.active { background: rgba(139,92,246,0.25); color: #fff; border: 1px solid rgba(139,92,246,0.4); }

    /* Stat card */
    .stat-card {
      padding: 22px 24px; position: relative; overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      border-radius: 20px 20px 0 0;
    }
    .stat-card.purple::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
    .stat-card.blue::before   { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    .stat-card.emerald::before{ background: linear-gradient(90deg, #10b981, #34d399); }
    .stat-card.amber::before  { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .stat-card.rose::before   { background: linear-gradient(90deg, #f43f5e, #fb7185); }

    /* Badge */
    .badge {
      display: inline-flex; align-items: center; padding: 3px 10px;
      border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    }
    .badge-available { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .badge-sold      { background: rgba(99,102,241,0.2); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.3); }
    .badge-pending   { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .badge-rented    { background: rgba(59,130,246,0.2); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
    .badge-new       { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .badge-contacted { background: rgba(59,130,246,0.2); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
    .badge-qualified { background: rgba(139,92,246,0.2); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.3); }
    .badge-converted { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .badge-lost      { background: rgba(244,63,94,0.2); color: #fb7185; border: 1px solid rgba(244,63,94,0.3); }
    .badge-hot       { background: rgba(249,115,22,0.2); color: #fb923c; border: 1px solid rgba(249,115,22,0.3); }
    .badge-warm      { background: rgba(59,130,246,0.2); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
    .badge-cold      { background: rgba(148,163,184,0.2); color: #94a3b8; border: 1px solid rgba(148,163,184,0.3); }

    /* Btn */
    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      border: 1px solid rgba(139,92,246,0.5);
      color: #fff; padding: 9px 20px; border-radius: 10px;
      font-weight: 600; font-size: 13px; cursor: pointer;
      transition: all 0.2s; letter-spacing: 0.02em;
    }
    .btn-primary:hover { background: linear-gradient(135deg, #7c3aed, #5b21b6); transform: translateY(-1px); }
    .btn-secondary {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8); padding: 9px 20px; border-radius: 10px;
      font-weight: 500; font-size: 13px; cursor: pointer; transition: all 0.2s;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.12); color: #fff; }

    /* Input */
    .glass-input {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: #e2e8f0; border-radius: 10px; padding: 9px 14px;
      font-size: 13px; outline: none; width: 100%;
      transition: border-color 0.2s;
    }
    .glass-input:focus { border-color: rgba(139,92,246,0.6); }
    .glass-input::placeholder { color: rgba(255,255,255,0.3); }
    .glass-input option { background: #1e1b4b; color: #e2e8f0; }

    /* Progress bar */
    .prog-bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 99px; transition: width 0.8s ease; }

    /* Score ring */
    .score-ring { position: relative; display: inline-flex; align-items: center; justify-content: center; }

    /* Table */
    table { width: 100%; border-collapse: collapse; }
    thead th { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: rgba(255,255,255,0.4); padding: 10px 14px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); text-transform: uppercase; }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
    tbody tr:hover { background: rgba(255,255,255,0.04); }
    tbody td { padding: 12px 14px; font-size: 13px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.4); border-radius: 99px; }

    /* Insight chips */
    .insight-bullish    { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.25); border-radius: 12px; padding: 10px 14px; }
    .insight-bearish    { background: rgba(244,63,94,0.12);  border: 1px solid rgba(244,63,94,0.25);  border-radius: 12px; padding: 10px 14px; }
    .insight-neutral    { background: rgba(148,163,184,0.12);border: 1px solid rgba(148,163,184,0.25);border-radius: 12px; padding: 10px 14px; }
    .insight-opportunity{ background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25); border-radius: 12px; padding: 10px 14px; }

    .ai-gradient { background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 50%, #06b6d4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* Pulse dot */
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; position: relative; }
    .pulse-dot::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; animation: pulse 2s ease-out infinite; }
    .pulse-green { background: #10b981; }
    .pulse-green::after { border: 2px solid #10b981; }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(2); } }

    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 500; }

    /* Sidebar */
    #sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 240px; z-index: 100; }
    #main-content { margin-left: 240px; min-height: 100vh; padding: 28px 32px; position: relative; z-index: 1; }

    @media (max-width: 900px) {
      #sidebar { width: 64px; }
      #main-content { margin-left: 64px; padding: 20px 16px; }
      .nav-label { display: none; }
    }

    /* Section fade-in */
    .page { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Property card */
    .prop-card { overflow: hidden; transition: transform 0.2s; }
    .prop-card:hover { transform: translateY(-4px); }
    .prop-card img { width: 100%; height: 160px; object-fit: cover; }

    /* Donut chart container */
    .chart-wrap { position: relative; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const API = localStorage.getItem('re_api') || 'http://localhost:8000';

// ─── Helpers ────────────────────────────────────────────────────────────────

const fmt = (n) => n == null ? '—' : n >= 1_000_000
  ? `$${(n / 1_000_000).toFixed(2)}M`
  : n >= 1_000 ? `$${(n / 1_000).toFixed(0)}K` : `$${n.toLocaleString()}`;

const fmtNum = (n) => n == null ? '—' : n.toLocaleString();
const fmtPct = (n) => n == null ? '—' : `${n.toFixed(1)}%`;

function Badge({ status }) {
  return <span className={`badge badge-${status?.toLowerCase()}`}>{status}</span>;
}

function StatCard({ label, value, sub, color = 'purple', icon }) {
  return (
    <div className={`glass stat-card ${color} glow-${color}`}>
      <div className="flex items-start justify-between mb-3">
        <div className="text-xs font-medium uppercase tracking-widest" style={{color:'rgba(255,255,255,0.45)'}}>{label}</div>
        <span className="text-lg">{icon}</span>
      </div>
      <div className="text-2xl font-bold text-white mb-1">{value}</div>
      {sub && <div className="text-xs" style={{color:'rgba(255,255,255,0.45)'}}>{sub}</div>}
    </div>
  );
}

function SectionHeader({ title, subtitle, action }) {
  return (
    <div className="flex items-center justify-between mb-5">
      <div>
        <h2 className="text-lg font-semibold text-white">{title}</h2>
        {subtitle && <p className="text-xs mt-0.5" style={{color:'rgba(255,255,255,0.45)'}}>{subtitle}</p>}
      </div>
      {action}
    </div>
  );
}

function Spinner() {
  return (
    <div className="flex items-center justify-center py-12">
      <div className="w-8 h-8 border-2 border-violet-400 border-t-transparent rounded-full animate-spin"></div>
    </div>
  );
}

function ProgBar({ value, max, color }) {
  const pct = max ? Math.round((value / max) * 100) : 0;
  const colors = {
    purple: 'linear-gradient(90deg,#8b5cf6,#a78bfa)',
    blue:   'linear-gradient(90deg,#3b82f6,#60a5fa)',
    emerald:'linear-gradient(90deg,#10b981,#34d399)',
    amber:  'linear-gradient(90deg,#f59e0b,#fbbf24)',
    rose:   'linear-gradient(90deg,#f43f5e,#fb7185)',
  };
  return (
    <div className="prog-bar">
      <div className="prog-fill" style={{width:`${pct}%`, background: colors[color] || colors.purple}} />
    </div>
  );
}

// ─── Mini Chart ─────────────────────────────────────────────────────────────

function MiniLineChart({ data, color = '#8b5cf6', height = 60 }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !data?.length) return;
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
    const ctx = canvasRef.current.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, color + '55');
    grad.addColorStop(1, color + '00');
    chartRef.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels: data.map((_, i) => i),
        datasets: [{ data: data.map(d => d.value), borderColor: color, backgroundColor: grad,
          borderWidth: 2, tension: 0.4, fill: true, pointRadius: 0 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 800 },
        scales: { x: { display: false }, y: { display: false } },
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
      }
    });
    return () => { chartRef.current?.destroy(); };
  }, [data]);

  return <div style={{height}}><canvas ref={canvasRef} /></div>;
}

function DonutChart({ data, colors, height = 180 }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) { chartRef.current.destroy(); }
    const ctx = canvasRef.current.getContext('2d');
    chartRef.current = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: data.map(d => d.label),
        datasets: [{ data: data.map(d => d.value), backgroundColor: colors,
          borderColor: 'rgba(255,255,255,0.06)', borderWidth: 2, hoverOffset: 6 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '70%',
        plugins: { legend: { display: false }, tooltip: {
          backgroundColor: 'rgba(15,12,41,0.9)',
          titleColor: '#fff', bodyColor: 'rgba(255,255,255,0.7)',
          borderColor: 'rgba(139,92,246,0.3)', borderWidth: 1,
        }},
      }
    });
    return () => { chartRef.current?.destroy(); };
  }, [data]);

  return <div style={{height}}><canvas ref={canvasRef} /></div>;
}

function BarChart({ labels, values, color = '#8b5cf6', height = 180 }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) { chartRef.current.destroy(); }
    const ctx = canvasRef.current.getContext('2d');
    chartRef.current = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: color + 'aa',
          borderColor: color,
          borderWidth: 1,
          borderRadius: 6,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: {
          backgroundColor: 'rgba(15,12,41,0.9)',
          titleColor: '#fff', bodyColor: 'rgba(255,255,255,0.7)',
        }},
        scales: {
          x: { ticks: { color: 'rgba(255,255,255,0.4)', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
          y: { ticks: { color: 'rgba(255,255,255,0.4)', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
        }
      }
    });
    return () => { chartRef.current?.destroy(); };
  }, [labels, values]);

  return <div style={{height}}><canvas ref={canvasRef} /></div>;
}

// ─── Pages ──────────────────────────────────────────────────────────────────

function OverviewPage() {
  const [data, setData] = useState(null);
  const [market, setMarket] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    Promise.all([
      fetch(`${API}/api/v1/dashboard`).then(r => r.json()),
      fetch(`${API}/api/v1/market`).then(r => r.json()),
    ]).then(([d, m]) => { setData(d); setMarket(m); setLoading(false); });
  }, []);

  if (loading) return <Spinner />;
  if (!data) return <p className="text-red-400">Failed to load dashboard.</p>;

  const { properties: p, leads: l, revenue: r, recent_transactions, top_agents } = data;

  const donutProps = [
    { label: 'Available', value: p.available },
    { label: 'Sold', value: p.sold },
    { label: 'Pending', value: p.pending },
    { label: 'Rented', value: p.rented },
  ];
  const donutColors = ['#10b981','#8b5cf6','#f59e0b','#3b82f6'];

  const pipelineStages = ['new','contacted','qualified','converted','lost'];
  const pipelineValues = pipelineStages.map(s => l.pipeline[s] || 0);
  const pipelineColors = ['#10b981','#3b82f6','#8b5cf6','#34d399','#f43f5e'];

  // Market sparklines — NYC avg_price_sqft
  const nycPpsf = market?.market?.['New York']?.['avg_price_sqft'] || [];
  const miaPpsf = market?.market?.['Miami']?.['avg_price_sqft'] || [];

  return (
    <div className="page space-y-7">
      {/* KPI row */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard label="Total Listings" value={fmtNum(p.total)} sub={`${p.available} available`} color="purple" icon="🏠" />
        <StatCard label="Total Leads" value={fmtNum(l.total)} sub={`${l.new} new this cycle`} color="blue" icon="👥" />
        <StatCard label="Commission Earned" value={fmt(r.total_commission)} sub={`${fmtPct(r.avg_commission_rate)} avg rate`} color="emerald" icon="💰" />
        <StatCard label="Conversion Rate" value={fmtPct(l.conversion_rate)} sub={`${l.converted} converted leads`} color="amber" icon="📈" />
      </div>

      {/* Charts row */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        {/* Portfolio donut */}
        <div className="glass p-5">
          <SectionHeader title="Portfolio Status" subtitle="By listing status" />
          <DonutChart data={donutProps} colors={donutColors} height={180} />
          <div className="mt-4 grid grid-cols-2 gap-2">
            {donutProps.map((d, i) => (
              <div key={d.label} className="flex items-center gap-2 text-xs">
                <div className="w-2 h-2 rounded-full flex-shrink-0" style={{background: donutColors[i]}} />
                <span style={{color:'rgba(255,255,255,0.5)'}}>{d.label}</span>
                <span className="ml-auto font-semibold text-white">{d.value}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Lead pipeline */}
        <div className="glass p-5">
          <SectionHeader title="Lead Pipeline" subtitle="By funnel stage" />
          <BarChart labels={pipelineStages.map(s => s.charAt(0).toUpperCase()+s.slice(1))} values={pipelineValues} color="#8b5cf6" height={180} />
        </div>

        {/* Market sparklines */}
        <div className="glass p-5 space-y-4">
          <SectionHeader title="Market Pulse" subtitle="Price/sqft trend (12 weeks)" />
          {[
            { city: 'New York', data: nycPpsf, color: '#8b5cf6' },
            { city: 'Miami',    data: miaPpsf, color: '#3b82f6' },
          ].map(({ city, data: md, color }) => (
            <div key={city}>
              <div className="flex justify-between text-xs mb-1">
                <span style={{color:'rgba(255,255,255,0.6)'}}>{city}</span>
                <span className="font-semibold text-white">${md[md.length-1]?.value?.toFixed(0)}/sqft</span>
              </div>
              <MiniLineChart data={md} color={color} height={46} />
            </div>
          ))}
          <div className="mt-2 pt-3" style={{borderTop:'1px solid rgba(255,255,255,0.06)'}}>
            <div className="flex justify-between text-xs">
              <span style={{color:'rgba(255,255,255,0.45)'}}>Total Sales Volume</span>
              <span className="font-semibold text-white">{fmt(r.total_sales_volume)}</span>
            </div>
            <div className="flex justify-between text-xs mt-1">
              <span style={{color:'rgba(255,255,255,0.45)'}}>Avg Property Value</span>
              <span className="font-semibold text-white">{fmt(p.avg_price)}</span>
            </div>
          </div>
        </div>
      </div>

      {/* Bottom row */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        {/* Recent transactions */}
        <div className="glass p-5">
          <SectionHeader title="Recent Transactions" subtitle="Last 5 closed deals" />
          <table>
            <thead><tr>
              <th>Property</th><th>Type</th><th>Amount</th><th>Agent</th><th>Commission</th>
            </tr></thead>
            <tbody>
              {recent_transactions.map(t => (
                <tr key={t.id}>
                  <td>
                    <div className="font-medium text-white text-xs">{t.property}</div>
                    <div className="text-xs" style={{color:'rgba(255,255,255,0.4)'}}>{t.city}</div>
                  </td>
                  <td><Badge status={t.type} /></td>
                  <td className="font-semibold text-emerald-400">{fmt(t.amount)}</td>

function LeadsPage() {
  const [leads, setLeads] = useState([]);
  const [loading, setLoading] = useState(true);
  const [scores, setScores] = useState({});
  const [filter, setFilter] = useState({ status: '', source: '' });
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ name:'', email:'', phone:'', source:'website', status:'new', budget:'', notes:'' });

  const load = useCallback(() => {
    setLoading(true);
    const params = new URLSearchParams();
    if (filter.status) params.set('status', filter.status);
    if (filter.source) params.set('source', filter.source);
    fetch(`${API}/api/v1/leads?${params}&limit=50`)
      .then(r => r.json()).then(d => { setLeads(d.leads || []); setLoading(false); });
  }, [filter]);

  useEffect(() => { load(); }, [load]);

  async function scoreAll(leads) {
    const scored = {};
    await Promise.all(leads.slice(0, 12).map(async l => {
      const r = await fetch(`${API}/api/v1/ai/lead-score/${l.id}`);
      const d = await r.json();
      scored[l.id] = d;
    }));
    setScores(scored);
  }

  useEffect(() => { if (leads.length) scoreAll(leads); }, [leads]);

  async function saveLead(e) {
    e.preventDefault();
    const payload = { ...form, budget: form.budget ? Number(form.budget) : null };
    await fetch(`${API}/api/v1/leads`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    setShowForm(false); load();

  return (
    <div className="page space-y-5">

        action={<button className="btn-primary" onClick={() => setShowForm(!showForm)}>+ Add Lead</button>}

              {opts.map(o => <option key={o} value={o}>{o || `All ${key}s`}</option>)}

          </div>

        <div className="flex items-end">
          <button className="btn-secondary" onClick={load}>Filter</button>

              { key:'phone', label:'Phone', type:'text' },
              { key:'budget', label:'Budget ($)', type:'number' },

              <div key={key}>
                <label className="block text-xs mb-1" style={{color:'rgba(255,255,255,0.4)'}}>{label}</label>

              <div key={key}>
                <label className="block text-xs mb-1 capitalize" style={{color:'rgba(255,255,255,0.4)'}}>{key}</label>

                return (

                    <td>

                      <div className="text-xs" style={{color:'rgba(255,255,255,0.4)'}}>{lead.email}</div>
                    </td>
                    <td><span className="text-xs" style={{color:'rgba(255,255,255,0.6)'}}>{lead.source}</span></td>
                    <td><Badge status={lead.status} /></td>
                    <td className="font-medium text-white">{fmt(lead.budget)}</td>
                    <td>
                      {sc ? (
                        <div className="flex items-center gap-2">
                          <div className="text-sm font-bold" style={{color: sc.tier==='Hot' ? '#fb923c' : sc.tier==='Warm' ? '#60a5fa' : '#94a3b8'}}>

                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

              <div>
                <label className="text-xs block mb-1" style={{color:'rgba(255,255,255,0.4)'}}>Condition</label>
                <select className="glass-input" value={valForm.condition} onChange={e => setValForm(f => ({...f,condition:e.target.value}))}>
                  {['poor','fair','good','excellent'].map(o => <option key={o} value={o}>{o}</option>)}
                </select>
              </div>
              <div>
                <label className="text-xs block mb-1" style={{color:'rgba(255,255,255,0.4)'}}>Bedrooms</label>
                <input className="glass-input" type="number" value={valForm.bedrooms} onChange={e => setValForm(f => ({...f,bedrooms:e.target.value}))} />
              </div>
              <div>
                <label className="text-xs block mb-1" style={{color:'rgba(255,255,255,0.4)'}}>Bathrooms</label>
                <input className="glass-input" type="number" value={valForm.bathrooms} onChange={e => setValForm(f => ({...f,bathrooms:e.target.value}))} />
              </div>
            </div>
            <button type="submit" className="btn-primary w-full" disabled={valLoading}>
              {valLoading ? 'Valuating…' : '✦ Get AI Valuation'}
            </button>
          </form>

          {valResult && (
            <div className="glass-dark p-4 space-y-3">
              <div className="text-center">
                <div className="text-xs mb-1" style={{color:'rgba(255,255,255,0.4)'}}>Estimated Value</div>
                <div className="text-3xl font-bold text-white">{fmt(valResult.estimated_value)}</div>
                <div className="text-xs mt-1" style={{color:'rgba(255,255,255,0.45)'}}>
                  Range: {fmt(valResult.range_low)} – {fmt(valResult.range_high)}
                </div>
                <div className="flex justify-center gap-2 mt-2">
                  <span className="badge badge-available">{fmtPct(valResult.confidence * 100)} confidence</span>
                  <span className="tag" style={{background:'rgba(139,92,246,0.2)',color:'#c4b5fd'}}>${valResult.price_per_sqft}/sqft</span>
                </div>
              </div>
              <div className="space-y-2 mt-3">
                {valResult.factors.map((f, i) => (
                  <div key={i} className="flex justify-between items-center text-xs">
                    <span style={{color:'rgba(255,255,255,0.55)'}}>{f.factor}</span>
                    <span className={f.impact.startsWith('+') ? 'text-emerald-400' : f.impact.startsWith('-') ? 'text-rose-400' : 'text-blue-400'} style={{fontWeight:600}}>{f.impact}</span>
                  </div>
                ))}
              </div>
              <p className="text-xs text-center mt-2" style={{color:'rgba(255,255,255,0.5)'}}>{valResult.recommendation}</p>
            </div>
          )}
        </div>

        {/* Portfolio optimizer */}
        <div className="glass p-5 space-y-4">
          <div>
            <h3 className="text-sm font-semibold text-white">Portfolio Optimizer <span className="ai-gradient text-xs ml-1">AI</span></h3>
            <p className="text-xs mt-0.5" style={{color:'rgba(255,255,255,0.4)'}}>AI-generated recommendations for your portfolio</p>
          </div>
          <button className="btn-primary w-full" onClick={optimizePortfolio} disabled={portLoading}>
            {portLoading ? 'Analyzing…' : '✦ Analyze Portfolio'}
          </button>

          {portfolio && (
            <div className="space-y-4">
              {/* Portfolio overview */}
              <div className="grid grid-cols-2 gap-3">
                <div className="glass-dark p-3 text-center">
                  <div className="text-xs mb-1" style={{color:'rgba(255,255,255,0.4)'}}>Properties</div>
                  <div className="text-xl font-bold text-white">{portfolio.portfolio_size}</div>
                </div>
                <div className="glass-dark p-3 text-center">
                  <div className="text-xs mb-1" style={{color:'rgba(255,255,255,0.4)'}}>Available Value</div>
                  <div className="text-xl font-bold text-violet-300">{fmt(portfolio.total_available_value)}</div>
                </div>
              </div>

              {/* By type donut */}
              <div className="grid grid-cols-2 gap-2 text-xs">
                {Object.entries(portfolio.by_type).map(([type, count]) => (
                  <div key={type} className="flex items-center gap-2 glass-dark px-3 py-2 rounded-lg">
                    <span>{{'apartment':'🏢','villa':'🏡','commercial':'🏗️','land':'🌿'}[type]}</span>
                    <span className="capitalize" style={{color:'rgba(255,255,255,0.6)'}}>{type}</span>
                    <span className="ml-auto font-semibold text-white">{count}</span>
                  </div>
                ))}
              </div>

              {/* Recommendations */}
              <div>
                <div className="text-xs font-semibold mb-2" style={{color:'rgba(255,255,255,0.4)'}}>RECOMMENDATIONS</div>
                <div className="space-y-2">
                  {portfolio.recommendations.map((rec, i) => (
                    <div key={i} className="glass-dark p-3 rounded-xl border-l-2"
                      style={{borderLeftColor: priorityColor[rec.priority]}}>
                      <div className="flex items-center gap-2 mb-1">
                        <span>{recIcon[rec.type] || '•'}</span>
                        <span className="text-xs font-semibold text-white capitalize">{rec.type.replace('_',' ')}</span>
                        <span className="ml-auto text-xs font-semibold" style={{color: priorityColor[rec.priority]}}>{rec.priority}</span>
                      </div>
                      <p className="text-xs" style={{color:'rgba(255,255,255,0.55)'}}>{rec.insight}</p>
                      {rec.property && <p className="text-xs mt-1 text-violet-300">→ {rec.property}</p>}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Sidebar ─────────────────────────────────────────────────────────────────

const PAGES = [
  { id:'overview',    label:'Overview',    icon:'⬛' },
  { id:'properties',  label:'Properties',  icon:'🏠' },
  { id:'leads',       label:'Leads & CRM', icon:'👥' },
  { id:'market',      label:'Market Intel',icon:'📊' },
  { id:'ai',          label:'AI Tools',    icon:'✦'  },
];

function Sidebar({ page, setPage }) {
  return (
    <div id="sidebar" className="glass-dark flex flex-col p-4 gap-1"
      style={{borderRight:'1px solid rgba(255,255,255,0.07)'}}>
      {/* Logo */}
      <div className="mb-5 px-2">
        <div className="text-lg font-bold">
          <span className="ai-gradient">Estate</span><span className="text-white">AI</span>
        </div>
        <div className="flex items-center gap-1.5 mt-1">
          <span className="pulse-dot pulse-green"></span>
          <span className="text-xs" style={{color:'rgba(255,255,255,0.35)'}}>Live</span>
        </div>
      </div>

      <div className="text-xs font-semibold mb-2 px-2" style={{color:'rgba(255,255,255,0.25)',letterSpacing:'0.1em'}}>NAVIGATION</div>

      {PAGES.map(p => (
        <div key={p.id}
          className={`nav-item ${page === p.id ? 'active' : ''}`}
          onClick={() => setPage(p.id)}>
          <span className="text-base w-5 text-center flex-shrink-0">{p.icon}</span>
          <span className="nav-label">{p.label}</span>
        </div>
      ))}

      {/* Bottom */}
      <div className="mt-auto pt-4" style={{borderTop:'1px solid rgba(255,255,255,0.06)'}}>
        <div className="nav-item">
          <span className="text-base w-5 text-center flex-shrink-0">⚙️</span>
          <span className="nav-label text-xs">Settings</span>
        </div>
        <div className="px-2 mt-3">
          <div className="text-xs" style={{color:'rgba(255,255,255,0.2)'}}>EstateAI v1.0</div>
          <div className="text-xs mt-0.5" style={{color:'rgba(255,255,255,0.15)'}}>Real Estate Platform</div>
        </div>
      </div>
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────

function App() {
  const [page, setPage] = useState('overview');
  const pageLabel = PAGES.find(p => p.id === page)?.label || 'Overview';

  return (
    <>
      <Sidebar page={page} setPage={setPage} />
      <div id="main-content">
        {/* Top bar */}
        <div className="flex items-center justify-between mb-7">
          <div>
            <h1 className="text-xl font-semibold text-white">{pageLabel}</h1>
            <p className="text-xs mt-0.5" style={{color:'rgba(255,255,255,0.35)'}}>
              {new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' })}
            </p>
          </div>
          <div className="flex items-center gap-3">
            <div className="glass px-3 py-2 flex items-center gap-2" style={{borderRadius:'12px'}}>
              <span className="pulse-dot pulse-green"></span>
              <span className="text-xs" style={{color:'rgba(255,255,255,0.6)'}}>API Connected</span>
            </div>
            <div className="w-9 h-9 rounded-full flex items-center justify-center text-sm font-bold"
              style={{background:'linear-gradient(135deg,#8b5cf6,#3b82f6)'}}>A</div>
          </div>
        </div>

        {page === 'overview'   && <OverviewPage />}
        {page === 'properties' && <PropertiesPage />}
        {page === 'leads'      && <LeadsPage />}
        {page === 'market'     && <MarketPage />}
        {page === 'ai'         && <AIPage />}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
